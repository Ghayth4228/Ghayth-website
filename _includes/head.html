<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Amiri:wght@400;700&family=Amiri+Quran&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>{% if page.title %}{{ page.title }} — Ghayth{% else %}Ghayth — غيث | Islamic Education{% endif %}</title>
<style>
  :root{
    --white:#FBFAF6;
    --white-2:#F4F1E9;
    --ink:#0E2A47;
    --ink-2:#123356;
    --ink-deep:#081A2C;
    --blue:#1C4870;
    --blue-soft:#3B6690;
    --gold:#A9823C;
    --gold-soft:#C7A567;
    --text:#26313D;
    --text-soft:#5B6672;
    --line:#E4E0D4;
    --line-2:rgba(14,42,71,0.12);
    --shadow: 0 1px 2px rgba(14,42,71,0.04), 0 8px 24px rgba(14,42,71,0.06);
    --serif: "Fraunces", Georgia, serif;
    --arabic: "Amiri", serif;
    --quran: "Amiri Quran", serif;
    --sans: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--white);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  .arabic{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate;}

  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }

  .eyebrow{
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
  }

  h1,h2,h3{
    font-family:var(--serif);
    color:var(--ink);
    font-weight:600;
    letter-spacing:-0.01em;
  }

  /* ================= NAV ================= */
  .nav{
    position:sticky; top:0; z-index:100;
    background:rgba(251,250,246,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px;max-width:1180px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{height:30px;width:auto;display:block;}
  .brand-en{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);letter-spacing:0.01em;}
  .nav-links{display:flex;gap:36px;align-items:center;}
  .nav-links a{
    display:block;
    font-size:14.5px;font-weight:600;color:var(--text);position:relative;padding:4px 0;
    transition:color .2s;
  }
  .nav-links a::after{
    content:"";position:absolute;left:0;bottom:-2px;height:1.5px;width:0;
    background:var(--gold);transition:width .25s ease;
  }
  .nav-links a:hover{color:var(--ink);}
  .nav-links a:hover::after{width:100%;}
  .nav-cta{
    background:var(--ink);color:var(--white)!important;
    padding:10px 20px;border-radius:3px;font-size:14px;font-weight:600;
    transition:background .2s;
  }
  .nav-cta:hover{background:var(--ink-2);}
  .nav-cta::after{display:none;}
  .burger{display:none;background:none;border:none;cursor:pointer;padding:6px;position:relative;z-index:2;}
  .burger span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0;transition:transform .25s ease, opacity .2s ease;}
  .burger.active span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .burger.active span:nth-child(2){opacity:0;}
  .burger.active span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  @media (max-width:860px){
    .nav-links{
      display:none;
      position:absolute;top:100%;left:0;right:0;background:var(--white);
      flex-direction:column;align-items:stretch;gap:0;
      border-bottom:1px solid var(--line);
      box-shadow:0 12px 24px rgba(14,42,71,0.08);
    }
    .nav-links.open{display:flex;}
    .nav-links a{width:100%;padding:16px 32px;border-bottom:1px solid var(--line);}
    .nav-links a::after{display:none;}
    /* .nav-links a alone outranks .nav-cta on specificity, so the button needs its own scoped rule here */
    .nav-links a.nav-cta{
      width:calc(100% - 64px);
      margin:16px 32px 20px;
      padding:12px 20px;
      border-bottom:none;
      text-align:center;
      border-radius:3px;
    }
    .burger{display:block;}
  }

  /* ================= HERO ================= */
  .hero{position:relative;padding:96px 0 80px;overflow:hidden;}
  .hero-inner{
    max-width:640px;
  }
  .hero h1{
    font-size:clamp(38px,5.2vw,60px);
    line-height:1.08;
    margin-bottom:22px;
  }
  .hero h1 em{
    font-style:italic;color:var(--blue);
  }
  .hero p.lead{
    font-size:18px;color:var(--text-soft);max-width:480px;margin-bottom:34px;
  }
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-block;padding:13px 26px;border-radius:3px;font-weight:600;font-size:15px;
    transition:all .2s ease;
  }
  .btn-primary{background:var(--ink);color:var(--white);}
  .btn-primary:hover{background:var(--ink-2);transform:translateY(-1px);}
  .btn-ghost{border:1px solid var(--line-2);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);background:var(--white-2);}

  /* epigraph */
  .epigraph{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:40px 0;background:var(--white-2);
  }
  .epigraph-inner{
    max-width:760px;margin:0 auto;text-align:center;padding:0 24px;
  }
  .epigraph .arabic{font-family:var(--quran);font-size:26px;color:var(--ink);line-height:2.2;display:block;margin-bottom:14px;}
  .epigraph p{font-size:15.5px;color:var(--text-soft);font-style:italic;}
  .epigraph cite{display:block;margin-top:10px;font-size:12.5px;font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);}

  /* ================= SECTIONS ================= */
  section.block{padding:96px 0;}
  .block-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:48px;gap:24px;flex-wrap:wrap;
  }
  .block-head h2{font-size:clamp(28px,3.4vw,38px);margin-top:10px;}
  .block-head p{color:var(--text-soft);max-width:360px;font-size:15px;}
  .view-all{font-size:14px;font-weight:700;color:var(--blue);white-space:nowrap;position:relative;}
  .view-all::after{content:" →";}

  .divider-rain{display:flex;justify-content:center;gap:5px;margin:0 auto 8px;width:fit-content;}
  .divider-rain span{width:1px;height:18px;background:var(--gold-soft);opacity:.6;}
  .divider-rain span:nth-child(2){height:26px;}
  .divider-rain span:nth-child(4){height:12px;}

  /* Articles */
  .grid-articles{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
  .card{
    background:var(--white);border:1px solid var(--line);border-radius:4px;
    padding:28px;transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-2);}
  .card .tag{
    font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--blue);margin-bottom:14px;display:block;
  }
  .card h3{font-size:20px;line-height:1.32;margin-bottom:10px;}
  .card p{font-size:14.5px;color:var(--text-soft);margin-bottom:16px;}
  .card .meta{font-size:12.5px;color:var(--text-soft);display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:14px;}

  @media (max-width:900px){.grid-articles{grid-template-columns:1fr 1fr;}}
  @media (max-width:640px){.grid-articles{grid-template-columns:1fr;}}

  /* Answers */
  .answers-list{display:flex;flex-direction:column;border-top:1px solid var(--line);}
  .qa{
    border-bottom:1px solid var(--line);padding:30px 0;cursor:pointer;
  }
  .qa-q{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
  .qa-q h3{font-size:18px;font-weight:600;color:var(--ink);flex:1;}
  .qa-icon{
    width:26px;height:26px;border:1px solid var(--line-2);border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--blue);
    font-size:15px;transition:transform .25s ease, background .2s ease;
  }
  .qa.open .qa-icon{transform:rotate(45deg);background:var(--white-2);}
  .qa-a{
    max-height:0;overflow:hidden;transition:max-height .35s ease;
  }
  .qa.open .qa-a{max-height:200px;}
  .qa-a p{padding-top:16px;color:var(--text-soft);font-size:15px;max-width:680px;}
  .qa-a .tag-row{padding-top:14px;display:flex;gap:8px;}
  .qa-a .pill{font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:.05em;text-transform:uppercase;}

  /* Courses */
  .courses-section{background:var(--white-2);}
  .grid-courses{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}
  .course{
    background:var(--white);border:1px solid var(--line);border-radius:4px;
    padding:30px;display:flex;gap:22px;align-items:flex-start;
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .course:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
  .course-num{
    font-family:var(--arabic);font-size:17px;color:var(--gold);border:1px solid var(--gold-soft);
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .course h3{font-size:19px;margin-bottom:8px;}
  .course p{font-size:14.5px;color:var(--text-soft);margin-bottom:14px;}
  .course .meta{display:flex;gap:16px;font-size:12.5px;color:var(--blue);font-weight:600;}

  @media (max-width:760px){.grid-courses{grid-template-columns:1fr;}}

  /* About */

  /* Newsletter */
  .newsletter{background:var(--ink);padding:80px 0;text-align:center;}
  .newsletter .arabic{font-size:22px;color:var(--gold-soft);display:block;margin-bottom:14px;}
  .newsletter h2{color:var(--white);font-size:clamp(26px,3.4vw,34px);margin-bottom:14px;}
  .newsletter p{color:rgba(251,250,246,0.6);margin-bottom:32px;font-size:15.5px;}
  .newsletter-form{display:flex;justify-content:center;gap:10px;max-width:440px;margin:0 auto;flex-wrap:wrap;}
  .newsletter-form input{
    flex:1;min-width:220px;padding:13px 16px;border-radius:3px;border:1px solid rgba(251,250,246,0.2);
    background:rgba(251,250,246,0.06);color:var(--white);font-size:14.5px;font-family:var(--sans);
  }
  .newsletter-form input::placeholder{color:rgba(251,250,246,0.4);}
  .newsletter-form button{
    background:var(--gold);color:var(--ink-deep);border:none;padding:13px 24px;border-radius:3px;
    font-weight:700;font-size:14.5px;cursor:pointer;transition:background .2s;
  }
  .newsletter-form button:hover{background:var(--gold-soft);}

  /* Footer */
  footer{background:var(--ink-deep);color:rgba(251,250,246,0.55);padding:64px 0 28px;}
  .footer-top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;margin-bottom:56px;}
  .footer-brand .brand-en{color:var(--white);}
  .footer-brand p{margin-top:14px;font-size:14px;max-width:280px;line-height:1.7;}
  .footer-col h5{
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-soft);
    margin-bottom:18px;font-weight:700;
  }
  .footer-col a{display:block;font-size:14px;margin-bottom:12px;color:rgba(251,250,246,0.6);transition:color .2s;}
  .footer-col a:hover{color:var(--white);}
  .footer-bottom{
    border-top:1px solid rgba(251,250,246,0.1);padding-top:24px;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px;
  }
  @media (max-width:760px){.footer-top{grid-template-columns:1fr 1fr;}}
  @media (max-width:480px){.footer-top{grid-template-columns:1fr;}}

  /* reveal on scroll */
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease, transform .6s ease;}
  .reveal.visible{opacity:1;transform:none;}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none;}
  }

  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* Empty state */
  .empty-state{
    border:1px dashed var(--line-2);border-radius:6px;
    padding:64px 24px;text-align:center;
  }

  /* Single article page */
  .article-header{padding:64px 0 40px;border-bottom:1px solid var(--line);}
  .article-header .tag{
    font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--blue);margin-bottom:16px;display:block;
  }
  .article-header h1{font-size:clamp(30px,4vw,44px);line-height:1.15;margin-bottom:16px;}
  .article-meta-bar{display:flex;gap:16px;font-size:13px;color:var(--text-soft);flex-wrap:wrap;}
  .article-body{padding-top:56px;padding-bottom:80px;max-width:680px;}
  .article-body p{font-size:17px;line-height:1.8;color:var(--text);margin-bottom:24px;}
  .article-body h2{font-size:24px;margin:44px 0 18px;}
  .article-body blockquote{
    border-left:3px solid var(--gold);padding-left:22px;margin:36px 0;
    font-family:var(--serif);font-size:19px;font-style:italic;color:var(--ink);line-height:1.6;
  }
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--blue);margin-bottom:24px;}
  .back-link::before{content:"←";}
  /* Single course page */
  .course-header{padding:64px 0 40px;border-bottom:1px solid var(--line);}
  .course-header-inner{display:flex;gap:22px;align-items:flex-start;}
  .course-header .course-num{width:52px;height:52px;font-size:22px;flex-shrink:0;}
  .course-header h1{font-size:clamp(28px,3.6vw,40px);line-height:1.15;margin-bottom:10px;}
  .course-header-meta{display:flex;gap:16px;font-size:13px;color:var(--blue);font-weight:600;flex-wrap:wrap;}
  .course-body{padding-top:56px;padding-bottom:40px;display:grid;grid-template-columns:1.6fr 1fr;gap:56px;}
  @media (max-width:860px){.course-body{grid-template-columns:1fr;}}
  .course-body p{font-size:16.5px;line-height:1.8;color:var(--text);margin-bottom:22px;}
  .course-body h2{font-size:21px;margin:36px 0 14px;}
  .course-body ul{margin:0 0 24px;padding-left:0;}
  .course-body ul li{
    font-size:15.5px;line-height:1.6;color:var(--text);margin-bottom:12px;
    padding-left:26px;position:relative;
  }
  .course-body ul li::before{content:"✓";position:absolute;left:0;color:var(--gold);font-weight:700;}
  .enroll-card{
    background:var(--white-2);border:1px solid var(--line);border-radius:6px;
    padding:28px;align-self:start;position:sticky;top:96px;
  }
  .enroll-card .price{font-family:var(--serif);font-size:28px;color:var(--ink);margin-bottom:6px;}
  .enroll-card .price-note{font-size:13px;color:var(--text-soft);margin-bottom:22px;}
  .enroll-card .btn{width:100%;text-align:center;box-sizing:border-box;margin-bottom:12px;}
  .enroll-card .fine-print{font-size:12.5px;color:var(--text-soft);line-height:1.5;margin-top:14px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--blue);margin-bottom:24px;}
  .back-link::before{content:"←";}
</style>
</head>
